name: Test

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The other MOCA repositories, at fixed refs: release tags, or commits while a Spec Change
# Proposal is in flight; never a branch (moca-spec CONTRIBUTING.md).
env:
  MOCA_SPEC_REF: 9f463646c4633d148c37984dce3ca7bdb752a22c  # 0.7.0 release candidate; v0.7.0 once tagged
  MOCA_READER_TYPESCRIPT_REF: cec9adf1d8b9bf6d6b4ef41a2c4c79a6fe704224  # 0.7.0 release candidate; v0.7.0 once tagged

jobs:
  deps:
    name: Public dependencies only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: moca-convert
      # The check lives in moca-spec, the one copy every open repository runs.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/moca-spec
          ref: ${{ env.MOCA_SPEC_REF }}
          path: moca-spec
          # Read access to the other MOCA repos while they are private.
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node moca-spec/scripts/check-deps.mjs moca-convert

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: moca-convert
      # @openmoca/moca-core is linked from moca-reader-typescript until its 0.7.0 is on npm.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/moca-reader-typescript
          ref: ${{ env.MOCA_READER_TYPESCRIPT_REF }}
          path: moca-reader-typescript
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      - run: npm ci
        working-directory: moca-reader-typescript
      - run: npm ci
        working-directory: moca-convert
      - run: npm test
        working-directory: moca-convert
